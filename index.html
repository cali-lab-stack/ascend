<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascend">
<meta name="theme-color" content="#03050b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Ascend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:79,195,255; --glow:rgb(var(--g)); --line:rgba(var(--g),.55);
  --bg:#03050b; --panel:rgba(8,20,42,.74);
  --text:#e6f4ff; --muted:#7f9bb8; --good:#4dffb5; --bad:#ff4d6a; --gold:#ffd166; --purple:#b48cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(var(--g),.28) 0%,#060b18 45%,#03050b 75%) fixed;overscroll-behavior-y:none}
button,input,select{font-family:inherit;touch-action:manipulation}
#view{position:relative;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 14px;margin:0 0 14px;
  box-shadow:0 0 14px rgba(var(--g),.22),inset 0 0 22px rgba(var(--g),.07);backdrop-filter:blur(6px)}
.prestige .panel{animation:pglow 4s ease-in-out infinite}
@keyframes pglow{50%{box-shadow:0 0 26px rgba(var(--g),.5),inset 0 0 30px rgba(var(--g),.14)}}
.panel.red{border-color:rgba(255,77,106,.7);box-shadow:0 0 16px rgba(255,77,106,.35),inset 0 0 22px rgba(255,77,106,.1);background:rgba(40,6,14,.72);animation:none}
.ptitle{display:block;width:max-content;max-width:100%;margin:-2px auto 14px;padding:3px 14px;border:1px solid var(--line);
  letter-spacing:.22em;font-weight:700;font-size:.85rem;color:#fff;text-shadow:0 0 8px var(--glow);text-align:center}
.red .ptitle{border-color:rgba(255,77,106,.7);color:#ffd0d8;text-shadow:0 0 8px var(--bad)}
h3{margin:18px 0 8px;font-size:.8rem;letter-spacing:.2em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem} .center{text-align:center}
.good{color:var(--good)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{background:rgba(var(--g),.12);border:1px solid var(--line);color:#fff;padding:10px 14px;border-radius:4px;font-weight:700;letter-spacing:.08em;font-size:.95rem;cursor:pointer}
.btn:active{background:rgba(var(--g),.32)}
.btn.red{border-color:rgba(255,77,106,.7);background:rgba(255,77,106,.12);color:#ffd6dd}
.btn.full{width:100%}
.btn.sm{padding:7px 10px;font-size:.85rem}
.btn:disabled{opacity:.35}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:9px 10px;font-size:16px;font-family:inherit}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* avatar */
.avwrap{display:flex;justify-content:center;margin:-4px 0 4px}
.avwrap svg{width:210px;height:250px;overflow:visible}
.av-aura{animation:pulse 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:100px 135px}
.av-flicker{animation:flick 1.1s steps(3) infinite}
.av-orbit{animation:spin 14s linear infinite;transform-box:view-box;transform-origin:100px 70px}
.av-orbit2{animation:spin 22s linear infinite reverse;transform-box:view-box;transform-origin:100px 130px}
.av-sway{animation:sway 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:100px 220px}
.av-beat{animation:beat 1.4s ease-in-out infinite}
.av-flame{animation:flame 1.6s ease-in-out infinite alternate;transform-box:view-box;transform-origin:100px 236px}
.av-breathe{animation:breathe 4s ease-in-out infinite;transform-box:view-box;transform-origin:100px 236px}
@keyframes pulse{50%{opacity:.6;transform:scale(1.05)}}
@keyframes flick{0%{opacity:.9}33%{opacity:.35}66%{opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{50%{transform:skewX(-6deg)}}
@keyframes beat{0%,100%{opacity:.35}20%{opacity:1}40%{opacity:.5}}
@keyframes flame{to{transform:scaleY(1.08) scaleX(.97)}}
@keyframes breathe{50%{transform:scaleY(1.012)}}
.who{text-align:center}
.who .name{font-size:1.6rem;font-weight:700;letter-spacing:.05em}
.who .title{color:var(--purple);font-size:.9rem;letter-spacing:.06em}
.rank{display:inline-block;margin-top:6px;padding:1px 12px;border:1px solid var(--glow);color:var(--glow);font-weight:700;letter-spacing:.14em;font-size:.9rem;text-shadow:0 0 8px var(--glow)}
.cond{margin-top:6px;font-size:.8rem;letter-spacing:.2em;font-weight:700}

/* status */
.lvrow{display:flex;align-items:baseline;gap:10px}
.lvrow b{font-size:2.6rem;line-height:1;color:#fff;text-shadow:0 0 14px var(--glow)}
.bar{height:9px;background:rgba(255,255,255,.07);border:1px solid rgba(var(--g),.35);border-radius:2px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(var(--g),.55),var(--glow));box-shadow:0 0 10px var(--glow);transition:width .5s}
.bar.green i{background:linear-gradient(90deg,#14b87a,#4dffb5);box-shadow:0 0 10px var(--good)}
.bar.goldb i{background:linear-gradient(90deg,#c9932b,#ffd166);box-shadow:0 0 10px var(--gold)}
.bar.thin{height:5px;margin:5px 0 0}
.stat{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(var(--g),.15);padding:8px 0}
.stat .k{font-weight:700;letter-spacing:.12em;color:#fff}
.stat .v{font-size:1.3rem;font-weight:700}
.plus{width:30px;height:30px;padding:0;margin-left:8px;border-radius:50%;font-size:1.1rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:4px 10px;border:1px solid;border-radius:20px;font-size:.85rem;font-weight:600}
.chip.buff{border-color:rgba(77,255,181,.6);color:var(--good)}
.chip.debuff{border-color:rgba(255,77,106,.6);color:#ff8fa2}
.chip.perm{border-color:rgba(255,209,102,.6);color:var(--gold)}
.chip.neutral{border-color:rgba(var(--g),.5);color:#cfe9ff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:1.5rem}
.kpis span{font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
.skill{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(var(--g),.12)}
.skill.locked{opacity:.45}
.skill .sn{font-weight:700}
.skill .req{font-size:.78rem;white-space:nowrap;font-weight:700}

/* quests */
.qitem{padding:10px 0;border-bottom:1px solid rgba(var(--g),.15)}
.qitem:last-child{border-bottom:0}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qhead .lab{font-weight:700;font-size:1.05rem}
.qhead .cnt{font-weight:700;white-space:nowrap}
.qbtns{display:flex;gap:8px;margin-top:8px}
.qbtns .btn{flex:1;padding:8px 0}
.done-tag{color:var(--good);font-weight:700;letter-spacing:.1em;text-shadow:0 0 8px var(--good)}
.warn{color:#ff8fa2;font-size:.9rem;margin-top:10px}

/* log */
.crow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(var(--g),.12)}
.crow:last-child{border-bottom:0}
.crow .ci{flex:1;min-width:0}
.crow .ci b{font-size:1.02rem}
.crow .btn{min-width:62px;padding:9px 8px}
.crow .btn.num{min-width:40px}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tierb{background:rgba(var(--g),.06);border:1px solid rgba(var(--g),.35);color:var(--text);border-radius:4px;padding:9px 2px;text-align:center;font-weight:700;cursor:pointer}
.tierb small{display:block;font-size:.72rem;margin-top:2px}
.tierb.on{background:rgba(var(--g),.3);border-color:var(--glow);box-shadow:0 0 12px rgba(var(--g),.6);color:#fff}
.tierb.neg small{color:#ff8fa2}
.tierb.pos small{color:var(--good)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* log v3: sticky banner, collapsible sections, roomy rows */
.sumbar{position:sticky;top:0;z-index:4;margin:calc(-14px - env(safe-area-inset-top)) -14px 14px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:rgba(3,7,16,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(var(--g),.4);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.sb-grid{display:grid;grid-template-columns:1.15fr .9fr 1.25fr .8fr;gap:8px;align-items:end}
.sb-grid>div{min-width:0}
.sb-grid span{display:block;font-size:.66rem;letter-spacing:.16em;color:var(--muted);font-weight:700}
.sb-grid b{display:block;font-size:1.2rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-grid small{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-grid .bar{margin:3px 0 0}
.sb-fast{margin-top:8px;text-align:center;font-size:.85rem;font-weight:700;letter-spacing:.06em;color:#fff;border-top:1px solid rgba(var(--g),.18);padding-top:6px}
.sec{padding:0}
.sechead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);padding:15px 14px;cursor:pointer;text-align:left}
.sechead .st{font-weight:700;letter-spacing:.15em;font-size:.9rem;color:#fff;text-shadow:0 0 8px var(--glow);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:375px){.sechead .st{letter-spacing:.09em;font-size:.86rem}.sechead{gap:8px}}
.sechead .sm{flex:1 0 auto;text-align:right;font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sechead .chev{transition:transform .2s;color:var(--glow);font-size:.9rem}
.sec.open .chev{transform:rotate(180deg)}
.secbody{display:none;padding:0 14px 14px;border-top:1px solid rgba(var(--g),.2)}
.sec.open .secbody{display:block}
.xrow{padding:14px 0;border-bottom:1px solid rgba(var(--g),.14)}
.xrow:last-child{border-bottom:0}
.xtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.xtop b{font-size:1.15rem}
.xval{font-size:.95rem;font-weight:700;white-space:nowrap}
.xsub{font-size:.88rem;color:#9bb4cc;margin-top:3px;line-height:1.35}
.xbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.xbtns.two{grid-template-columns:repeat(2,1fr)}
.xbtns .btn{height:48px;padding:0;font-size:1rem}
.xbtns .pm{font-size:1.6rem;line-height:1}
.xbtns .btn.red{font-size:1.6rem}
.arr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(var(--g),.12)}
.arr .an{flex:1;font-weight:700}
.arr.sub{padding-left:16px}.arr.sub .an{font-weight:600;font-size:.95rem}
.arr .btn{width:40px;height:36px;padding:0}
.tile{text-align:left;background:rgba(255,77,106,.07);border:1px solid rgba(255,77,106,.45);color:var(--text);border-radius:5px;padding:10px;min-height:62px;cursor:pointer}
.tile:active{transform:scale(.97);background:rgba(255,77,106,.25)}
.tile.pos{background:rgba(var(--g),.08);border-color:rgba(var(--g),.45)}
.tile.lit{background:rgba(77,255,181,.15);border-color:var(--good)}
.tile .t{font-weight:700;font-size:1rem;line-height:1.15}
.tile .x{font-size:.82rem;margin-top:4px;font-weight:700}
.fastclock{font-size:2.4rem;font-weight:700;text-align:center;letter-spacing:.06em;text-shadow:0 0 12px var(--glow)}
.logitem{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(var(--g),.12)}
.logitem .tm{color:var(--muted);font-size:.8rem;margin-right:8px}
.x-btn{background:none;border:1px solid rgba(255,255,255,.2);color:var(--muted);border-radius:4px;padding:3px 8px;font-size:.8rem}

/* setup */
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(var(--g),.12);cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--glow);flex:none}
.chk b{font-size:1.02rem}

/* records */
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid rgba(var(--g),.3)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .b{width:100%;border-radius:2px 2px 0 0;min-height:2px}
.days{display:flex;gap:4px;margin-top:4px}
.days div{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}
.days .st{font-weight:700;font-size:.8rem}
.titlerow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(var(--g),.12)}
.titlerow.locked{opacity:.4}
.qedit{display:grid;grid-template-columns:1fr 74px 34px;gap:6px;margin-bottom:4px}
.qedit2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.qedit input,.qedit select,.qedit2 input,.qedit2 select{padding:7px}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(3,6,14,.94);border-top:1px solid rgba(var(--g),.35);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font-weight:700;letter-spacing:.08em;padding:15px 0 13px;font-size:.72rem;position:relative}
.cxh{margin:18px 0 6px;font-weight:700;letter-spacing:.14em;font-size:.82rem;color:#fff;text-shadow:0 0 8px var(--glow);display:flex;justify-content:space-between;align-items:baseline}
.cxh span{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-shadow:none}
.skill .tier{display:inline-block;min-width:26px;font-size:.72rem;color:var(--muted);font-weight:700}
.skill.close .req{color:var(--gold)}
.skill.on{background:linear-gradient(90deg,rgba(77,255,181,.08),transparent)}
.skill.capst .sn{color:var(--gold)}
.chip.link{cursor:pointer}
.cxp{font-size:.92rem;line-height:1.45;color:#c9dbec;margin:10px 0}
.cxrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(var(--g),.12)}
.cxrow.act{background:linear-gradient(90deg,rgba(var(--g),.14),transparent)}
.cxrow b{font-size:.98rem}
.cxrow .r{text-align:right;font-size:.85rem;font-weight:700;white-space:nowrap}
.btn.on{background:rgba(var(--g),.35);border-color:var(--glow);box-shadow:0 0 10px rgba(var(--g),.5)}
.bosswrap{display:flex;justify-content:center;margin:2px 0 4px}
.bossart{width:170px;height:170px;overflow:visible}
.bhurt{animation:bshake .4s}
@keyframes bshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bar.boss{height:14px}
.bar.boss i{background:linear-gradient(90deg,#ff4d6a,#ff8a5c);box-shadow:0 0 10px #ff4d6a}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.seg .btn{padding:8px 0;font-size:.85rem}
.kcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kcard{border:1px solid rgba(var(--g),.3);border-radius:6px;padding:10px;background:rgba(var(--g),.05)}
.kcard span{display:block;font-size:.68rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.kcard b{display:block;font-size:1.55rem;line-height:1.2;margin-top:2px}
.kcard small{display:block;font-size:.75rem;color:var(--muted)}
.trend{font-size:.78rem;font-weight:700;margin-left:4px}
.brow{display:grid;grid-template-columns:118px 1fr 58px;gap:8px;align-items:center;padding:4px 0;font-size:.88rem}
.brow .bt{height:10px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.brow.neg .bt i{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.brow .bv{text-align:right;font-weight:700}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid rgba(var(--g),.12);font-size:.92rem}
.hrow:last-child{border-bottom:0}
.hrow b{white-space:nowrap}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--gold);color:var(--gold);border-radius:10px;font-size:.66rem;font-weight:700;letter-spacing:.08em}
.trophy{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(var(--g),.12)}
.tabs button.on{color:#fff;text-shadow:0 0 10px var(--glow)}
.tabs button.on::after{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}
.tabs .dot{position:absolute;top:9px;right:calc(50% - 30px);width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}

/* modal + toast */
#modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(0,3,10,.74);z-index:20;padding:calc(env(safe-area-inset-top) + 9vh) 24px 24px;overflow-y:auto}
#modal.show{display:flex}
.sys{width:100%;max-width:400px;animation:pop .35s ease-out}
.sys .msg{font-size:1.08rem;line-height:1.45;text-align:center;margin:6px 0 16px}
.sys .msg b{color:#fff;text-shadow:0 0 8px var(--glow)}
@keyframes pop{from{transform:scale(.85);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.tst{padding:6px 16px;margin-bottom:6px;border:1px solid var(--line);background:rgba(4,12,28,.94);border-radius:4px;font-weight:700;letter-spacing:.05em;animation:tst 1.9s forwards;white-space:nowrap;text-align:center}
.tst.neg{border-color:rgba(255,77,106,.7);color:#ff9fb0}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* celebration light bursts (color = current rank) */
.fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx i,.fx b{position:absolute;display:block}
.fx-wash{inset:0;background:radial-gradient(circle at 50% 42%,var(--fx) 0%,rgba(0,0,0,0) 72%);animation:fxWash 1.3s ease-out both}
.fx-level .fx-wash{background:radial-gradient(circle at 50% 42%,#fff 0%,var(--fx) 30%,rgba(0,0,0,0) 85%);animation-duration:2.2s}
@keyframes fxWash{0%{opacity:0}10%{opacity:.9}100%{opacity:0}}
.fx-white{inset:0;background:#fff;animation:fxWhite .75s ease-out both}
@keyframes fxWhite{0%{opacity:.95}100%{opacity:0}}
.fx-ring{left:50%;top:42%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid var(--fx);
  box-shadow:0 0 28px var(--fx),inset 0 0 18px var(--fx);animation:fxRing 1.15s cubic-bezier(.15,.7,.35,1) both}
.fx-ring.r2{animation-delay:.14s;border-width:2px}.fx-ring.r3{animation-delay:.3s;border-width:6px}.fx-ring.r4{animation-delay:.5s;border-width:2px}
.fx-level .fx-ring{animation-duration:1.6s}
@keyframes fxRing{0%{transform:scale(.2);opacity:1}100%{transform:scale(24);opacity:0}}
.fx-rays{left:50%;top:42%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(var(--fx) 0deg 3deg,rgba(0,0,0,0) 3deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 18%,transparent 45%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 18%,transparent 45%);
  animation:fxRays 2.3s ease-out both}

function defaultEnabled(){ return Object.fromEntries(ACTS.map(a=>[a.id, STARTER.includes(a.id)])); }
function fresh(){
  const t = dayKey();
  return { v:8, wtUnit:'kg', wtGoal:null, wtHide:false, wtBonusWeek:null, recPeriod:'7', statsSince:t, boss:{n:1, fight:null, attemptWeek:null, defeated:[]}, victorUntil:null, cosmetic:null, timer:null, alloc:{STR:0,AGI:0,VIT:0,INT:0,SEN:0}, respecTokens:0, lastMonthlyRespec:null, autoRest:true, secondLifeUsed:null, questPool:null, questRot:0, open:{strength:true}, order:null, name:'', createdAt:t, lastCheck:t, lastActive:t, level:1, xp:0, points:0, maxRank:0,
    stats:{STR:10,AGI:10,VIT:10,INT:10,SEN:10}, enabled:defaultEnabled(), setupDone:false,
    quest:JSON.parse(JSON.stringify(DEFAULT_QUEST)), days:{}, totals:{}, bestStreak:0,
    viceRun:{}, viceBest:{}, cleanRun:0, cleanBest:0, penalty:null, fast:null, shieldUsed:null,
    titles:['r0'], title:'r0' };
}
function normalize(o){
  const s = Object.assign(fresh(), o);
  if(!o.v || o.v < 2){                                   // upgrade from v1
    const oldNeed = L => Math.round(100*Math.pow(L,1.5));
    let total = o.xp||0; for(let L=1; L<(o.level||1); L++) total += oldNeed(L);
    s.level = 1; s.xp = total; while(s.xp >= xpNeed(s.level)){ s.xp -= xpNeed(s.level); s.level++; }
    s.maxRank = rankIdx(s.level); s.points = (o.points||0) + RANK_POINTS*s.maxRank;
    s.enabled = defaultEnabled(); s.setupDone = false; s.quest = JSON.parse(JSON.stringify(DEFAULT_QUEST));
    s.viceRun = {alcohol:o.soberRun||0}; s.viceBest = {alcohol:o.soberBest||0};
    s.titles = ['r0']; s.title = 'r0'; s.lastActive = dayKey(); s.v = 2;
    Object.values(s.days).forEach(d=>{ d.drinks = undefined; });
  }
  if(s.v < 3){ s.v = 3; s.questPool = null; s.questRot = 0; s.upgradedV3 = true; }
  if(s.v < 4){ s.v = 4; if(Array.isArray(s.questPool)) s.questPool = [...s.questPool, 'steps','fast','read','meditate','study','pets']; s.upgradedV4 = true; }
  if(s.v === 6 || (s.v === 7 && !s.statsSince)){ s.v = 7; s.statsSince = dayKey(); s.recPeriod = s.recPeriod || '7'; s.upgradedV7 = true; }
  if(s.v < 6 && s.v >= 5){ s.v = 6; if(Array.isArray(s.questPool) && !s.questPool.includes('deadhang')) s.questPool.push('deadhang'); s.upgradedV6 = true; s.v = 7; s.statsSince = dayKey(); }
  if(s.v < 5){                                             // skill tree upgrade: estimate hand-placed points so respec works
    s.v = 5;
    const earned = LEVEL_POINTS*((s.level||1)-1) + Object.values(s.days||{}).filter(d=>d.status==='done').length + RANK_POINTS*(s.maxRank||0);
    const ex = Object.fromEntries(Object.keys(s.stats).map(k=>[k, Math.max(0, Math.floor(s.stats[k]-10))]));
    const exTot = Object.values(ex).reduce((a,b)=>a+b,0);
    let spent = Math.min(Math.max(0, earned - (s.points||0)), exTot);
    s.alloc = {STR:0,AGI:0,VIT:0,INT:0,SEN:0};
    if(exTot>0 && spent>0){
      const keys = Object.keys(ex).sort((a,b)=>ex[b]-ex[a]); let left = spent;
      keys.forEach(k=>{ const v = Math.min(ex[k], Math.floor(spent*ex[k]/exTot)); s.alloc[k]=v; left-=v; });
      for(const k of keys){ if(left<=0) break; const add=Math.min(ex[k]-s.alloc[k], left); s.alloc[k]+=add; left-=add; }
    }
    s.respecTokens = 1; s.autoRest = true; s.upgradedV5 = true; s.v = 7; s.statsSince = dayKey();
  }
  if(s.v < 8){                                             // v8: activities expansion, split sections, weight, boss overkill
    const split = (list, from, to) => { const i = list.indexOf(from); if(i>=0) list.splice(i, 1, ...to); else to.forEach(x=>{ if(!list.includes(x)) list.push(x); }); return list; };
    if(s.order && Array.isArray(s.order.cats)){ split(s.order.cats, 'exercise', ['strength','cardio']); split(s.order.cats, 'mind', ['mind','well']); }
    if(s.order && s.order.acts){
      const oa = s.order.acts;
      if(oa.exercise){ oa.strength = oa.exercise.filter(id=>A[id] && A[id].cat==='strength'); oa.cardio = oa.exercise.filter(id=>A[id] && A[id].cat==='cardio'); delete oa.exercise; }
      if(oa.mind){ const m = oa.mind; oa.mind = m.filter(id=>A[id] && A[id].cat==='mind'); oa.well = m.filter(id=>A[id] && A[id].cat==='well'); }
    }
    if(s.open){ if(s.open.exercise){ s.open.strength = s.open.cardio = true; } if(s.open.mind) s.open.well = true; delete s.open.exercise; delete s.open.rc_settings; }
    if(s.boss && s.boss.fight && !s.boss.fight.won) s.bossCatchup = true;
    s.v = 8; s.upgradedV8 = true;
  }
  s.boss = Object.assign({n:1, fight:null, attemptWeek:null, defeated:[]}, s.boss||{});
  s.alloc = Object.assign({STR:0,AGI:0,VIT:0,INT:0,SEN:0}, s.alloc||{});
  ACTS.forEach(a=>{ if(s.enabled[a.id]===undefined) s.enabled[a.id]=false; });   // new activities start switched off
  return s;
}

const units = (d,id) => d ? d.log.filter(e=>e.id===id).reduce((a,e)=>a+(e.n||0),0) : 0;

/* ---------- notifications ---------- */
const queue = [];
function notify(html, opts={}){ queue.push({html, ...opts}); if(!$('#modal').classList.contains('show')) nextModal(); }
function nextModal(){
  const m = $('#modal');
  if(!m.classList.contains('show') && Date.now() < modalHold){ clearTimeout(nextModal._t); nextModal._t = setTimeout(nextModal, modalHold-Date.now()); return; }
  const n = queue.shift();
  if(!n){ m.classList.remove('show'); m.innerHTML=''; return; }
  m.innerHTML = `<div class="panel sys ${n.red?'red':''}"><span class="ptitle">${n.title||'NOTIFICATION'}</span>
    <div class="msg">${n.html}</div>${n.extra||''}<button class="btn full ${n.red?'red':''}" id="mok">${n.ok||'CONFIRM'}</button>
    ${n.cancel?'<button class="btn full" id="mcancel" style="margin-top:8px;opacity:.7">CANCEL</button>':''}</div>`;
  m.classList.add('show');
  $('#mok').onclick = () => { if(n.onOk && n.onOk()===false) return; nextModal(); render(); };
  if(n.cancel) $('#mcancel').onclick = () => { nextModal(); render(); };
  const inp = m.querySelector('input'); if(inp) setTimeout(()=>inp.focus(), 60);
}
let modalHold = 0;
function fx(kind, label, sub){
  const c = `rgb(${RANKS[rankIdx(state.level)].rgb})`;
  const el = document.createElement('div'); el.className = 'fx fx-'+kind; el.style.setProperty('--fx', c);
  const sparks = n => Array.from({length:n}, (_,i)=>{ const a = (i/n)*Math.PI*2 + Math.random()*.4, r = 140 + Math.random()*(kind==='level'?260:150);
    return `<i class="fx-spark" style="--dx:${Math.round(Math.cos(a)*r)}px;--dy:${Math.round(Math.sin(a)*r)}px;animation-delay:${(Math.random()*.15).toFixed(2)}s"></i>`; }).join('');
  if(kind==='level'){
    el.innerHTML = `<i class="fx-white"></i><i class="fx-rays"></i><i class="fx-wash"></i><i class="fx-pillar"></i>
      <i class="fx-ring"></i><i class="fx-ring r2"></i><i class="fx-ring r3"></i><i class="fx-ring r4"></i>${sparks(36)}
      <b class="fx-text">${label||'LEVEL UP'}<small>${sub||esc(RANKS[rankIdx(state.level)].r)+'-RANK'}</small></b>`;
    document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'), 550);
    modalHold = Date.now() + 1300;
  } else {
    el.innerHTML = `<i class="fx-wash"></i><i class="fx-ring"></i><i class="fx-ring r2"></i>${sparks(18)}<b class="fx-text">${label||'QUEST CLEAR'}${sub?`<small>${sub}</small>`:''}</b>`;
    modalHold = Math.max(modalHold, Date.now() + 750);
  }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), kind==='level' ? 2600 : 1600);
}
function toast(text, neg){
  const el = document.createElement('div'); el.className = 'tst'+(neg?' neg':''); el.textContent = text;
  const box=$('#toast'); box.appendChild(el); while(box.children.length>2) box.firstChild.remove(); setTimeout(()=>el.remove(), 2000);
}

const ARCH = ['golem','wraith','beast','serpent','knight','eye','spider','dragon','titan','hydra'];
function bossInfo(n){
  const chapterBoss = n%10===0;
  const hp = Math.round(BOSS_HP1*Math.pow(BOSS_GROWTH, n-1)*(chapterBoss?BOSS_CH_MULT:1)/10)*10;
  const xp = Math.round((150 + 15*(n-1))*(chapterBoss?2:1));
  const pts = 3 + Math.floor((n-1)/10) + (chapterBoss?2:0);
  if(n===13) return {n, name:'K', arch:'k', chapter:null, special:true, chName:'???', rgb:'235,235,245', chapterBoss:false, hp, xp, pts, lore:'No record. No name. Only K.', cosmetic:null};
  if(n<=100){
    const ci = Math.floor((n-1)/10), ch = CHAPTERS[ci], [name, arch] = ch.b[(n-1)%10];
    return {n, name, arch, chapter:ci+1, chName:ch.name, rgb:ch.rgb, chapterBoss, hp, xp, pts, lore: chapterBoss ? ch.lore : BOSS_LORE[arch], cosmetic: chapterBoss ? ci+1 : null};
  }
  const f = n-100, arch = ARCH[(f-1)%10];
  return {n, name: chapterBoss ? `Tower Warden · Floor ${f}` : `Tower Guardian · Floor ${f}`, arch, chapter:null, chName:'Endless Tower', rgb:CHAPTERS[(Math.floor((f-1)/10))%10].rgb, chapterBoss, hp, xp, pts, lore: BOSS_LORE[arch], cosmetic:null};
}
const weekKey = (k=dayKey()) => { const dow = (keyDate(k).getDay()+6)%7; return addDays(k, -dow); };   // Monday of that week
const weekdayIdx = (k=dayKey()) => (keyDate(k).getDay()+6)%7;                                          // Mon=0 … Sun=6
const fightOn = (k=dayKey()) => { const f = state.boss.fight; return !!f && k>=f.start && k<=f.end; };
const OVERKILL_AT = 1.25, OVERKILL_BONUS = .25;   // 125% of HP → +25% of the boss's XP reward
const canChallenge = () => !state.boss.fight && state.boss.attemptWeek!==weekKey() && weekdayIdx()<=4;
function startBoss(){
  if(!canChallenge()) return;
  const b = bossInfo(state.boss.n), t = dayKey();
  state.boss.fight = {n:b.n, hp:b.hp, dmg:0, start:t, end:addDays(t, BOSS_DAYS-1), won:false};
  state.boss.attemptWeek = weekKey(t);
  const strike = openingStrike();
  fx('quest', 'FIGHT!', strike ? `OPENING STRIKE −${fmtN(Math.round(strike))} HP` : '');
  toast(strike ? `Opening strike: −${fmtN(Math.round(strike))} HP` : `${b.name} engaged · ${BOSS_DAYS} days`);
  checkBossWin(); save(); render();
}
/* XP already earned on the fight's first day counts too: any positive entry (and the quest reward) without recorded damage. */
function openingStrike(){
  const f = state.boss.fight; if(!f) return 0;
  const d = state.days[f.start]; if(!d) return 0;
  const pw = powerOf(); let dmg = 0;
  d.log.forEach(e=>{ if(e.xp>0 && !(e.dmg>0)){ e.dmg = r1(e.xp*pw); dmg += e.dmg; } });
  if(d.status==='done' && d.bonus>0 && !(d.bonusDmg>0)){ d.bonusDmg = r1(d.bonus*pw); dmg += d.bonusDmg; }
  if(d.wtBonus>0 && !(d.wtBonusDmg>0)){ d.wtBonusDmg = r1(d.wtBonus*pw); dmg += d.wtBonusDmg; }
  f.dmg = r1(f.dmg + dmg);
  return r1(dmg);
}
function bossHit(xp){                 // returns damage dealt (0 if no active fight)
  if(!(xp>0) || !fightOn()) return 0;
  const f = state.boss.fight, dmg = r1(xp*powerOf());
  f.dmg = r1(f.dmg + dmg); checkBossWin(); return dmg;
}
function bossHit_(xp){ const f = state.boss.fight; if(!f || !(xp>0)) return 0; const dmg = r1(xp*powerOf()); f.dmg = r1(f.dmg+dmg); checkBossWin(); return dmg; }
function bossUnhit(dmg){ const f = state.boss.fight; if(dmg>0 && f) f.dmg = Math.max(f.won ? f.hp : 0, r1(f.dmg - dmg)); }   // a win is never taken back
function checkBossWin(){
  const f = state.boss.fight; if(!f || f.won || f.dmg < f.hp) return;
  const b = bossInfo(f.n);
  f.won = true;                         // the fight keeps running until its last day for Overkill
  state.boss.defeated.push({n:b.n, name:b.name, date:dayKey()});
  state.boss.n = b.n + 1;
  state.points += b.pts; state.victorUntil = addDays(dayKey(), 2);
  if(b.cosmetic){ state.cosmetics = [...new Set([...(state.cosmetics||[]), b.cosmetic])]; state.cosmetic = b.cosmetic; }
  fx('level', 'VICTORY', esc(b.name));
  notify(`<b>${esc(b.name)} defeated!</b><br><br>Rewards:<br>+${b.xp} XP · +${b.pts} stat points<br><b>Victor's Spirit</b>: +10% all XP for 3 days${b.chapterBoss?`<br>Title: <b>${esc(CHAPTERS[b.chapter-1].title)}</b><br>Avatar: <b>${esc(CHAPTERS[b.chapter-1].cos)}</b>`:''}<br><br><b class="gold">Keep going:</b> the fight runs until ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][weekdayIdx(f.end)]} midnight. Reach ${Math.round(OVERKILL_AT*100)}% damage for an <b>Overkill</b> bonus (+${Math.round(b.xp*OVERKILL_BONUS)} XP).<br><br><span class="muted small">The next boss arrives Monday.</span>`, {title:'BOSS DEFEATED'});
  { const d = day(); d.extraXP = r1((d.extraXP||0) + b.xp); }
  gainXP(b.xp);
}

function ensureQuest(k=dayKey(), exclude){
  const d = day(k);

  let pool = questPool(); if(exclude && pool.length>1) pool = pool.filter(id=>id!==exclude);
  if(!pool.length){ d.quest = null; return null; }
  const done = id => recentAvg(id,k) > 0;
  let cats = QUEST_CATS.filter(c=>pool.some(id=>qgroup(A[id])===c && done(id)));
  if(!cats.length) cats = pool.some(id=>qgroup(A[id])==='exercise') ? ['exercise'] : [qgroup(A[pool[0]])];
  const y = state.days[addDays(k,-1)], yid = y && y.quest ? y.quest.id : null, ycat = yid && A[yid] ? qgroup(A[yid]) : null;
  let ci = (state.questCatRot||0) % cats.length;

function logCount(id, n){
  const a = A[id], d = day(); if(!(n>0)) return;

  const first = ids => !d.log.some(e=>ids.includes(e.id));
  let bonus = 0, bonusNote = '';
  if(a.g==='str' && skill('ironstart') && first(ACTS.filter(x=>x.g==='str').map(x=>x.id))){ bonus += 10; bonusNote = ' · Iron Start +10'; }
  if((id==='read'||id==='study') && skill('curious') && first(['read','study'])){ bonus += 10; bonusNote = ' · Curious Mind +10'; }
  const xp = r1(scale(raw, a.g, id) + bonus);
  const capNote = raw < a.rate*n ? (raw===0 ? ' (max reached)' : ' (soft cap)') : '';
  const msg = `${fmtXP(xp)} XP · ${fmtN(prev+n)} ${a.unit} ${a.label}${capNote}${bonusNote}`;
  const last = d.log[d.log.length-1];
  if(last && last.id===id && last.n && Date.now()-last.t < 15*60000){      // merge quick taps into one log line
    const st = statDelta(a, xp);
    last.n = r2(last.n + n); last.xp = r1(last.xp + xp); last.t = Date.now();
    for(const k in st) last.st[k] = r2((last.st[k]||0) + st[k]);

    const dmg = bossHit(xp); last.dmg = r1((last.dmg||0) + dmg); if(_cp){ last.cp = r1((last.cp||0) + _cp); _cp = 0; }
    addStats(st); gainXP(xp); toast(msg + (dmg?` · ${fmtN(Math.round(dmg))} dmg`:''), xp<0);

/* ---------- day rollover: penalties, clean days, decay ---------- */
function rollover(){
  const t = dayKey();
  if(state.lastCheck >= t) return;
  let k = state.lastCheck; if(addDays(t,-120) > k) k = addDays(t,-120);
  let rollXP=0, failed=0, lost=0, clean=0, cleanXP=0, decay=0, maxIdle=0, rested=0, saved=0, dream=0;
  while(k < t){
    if(k >= state.createdAt){
      const d = day(k), active = isActive(d);
      if(active && k > state.lastActive) state.lastActive = k;
      if(d.status!=='done' && d.status!=='rest'){
        if(state.autoRest!==false && restAllowed(k)){ d.status='rest'; d.autoRest=true; rested++; }
        else {
          d.status='failed';
          if(skill('resilience') && (!state.secondLifeUsed || daysBetween(state.secondLifeUsed, k)>=30)){ d.saved=true; state.secondLifeUsed=k; saved++; }
          if(failed<3){ let p = QUEST_MISS_XP; if(skill('resilience')) p = Math.round(p/2); lost += p; d.pen = (d.pen||0)+p; }
          failed++;
        }
      }
      if(active && transcendentMet(d) && !d.transcend){
        const earnedXP = d.log.reduce((x,e)=>x+Math.max(0,e.xp),0) + (d.bonus||0);
        d.transcend = true; d.dream = Math.round(earnedXP*.2); dream += d.dream; if(fightOn(k)) rollXP += d.dream;
      }
      if(active){
        let slipped = false;
        viceIds().forEach(v=>{ if(count(d,v)>0){ state.viceRun[v]=0; slipped=true; }
          else { state.viceRun[v]=(state.viceRun[v]||0)+1; state.viceBest[v]=Math.max(state.viceBest[v]||0, state.viceRun[v]); } });
        if(slipped) state.cleanRun = 0; else { state.cleanRun++; state.cleanBest = Math.max(state.cleanBest, state.cleanRun); clean++; cleanXP += cleanDayXP(); d.cleanXP = cleanDayXP(); if(fightOn(k)) rollXP += cleanDayXP(); }
      } else {
        const idle = daysBetween(state.lastActive, k);
        if(idle > DECAY_AFTER){ const amt = Math.round(xpNeed(state.level)*DECAY_PCT); decay += amt; d.pen=(d.pen||0)+amt; maxIdle = Math.max(maxIdle, idle); }
      }
    }
    k = addDays(k,1);
  }
  state.lastCheck = t;
  if(rollXP) bossHit_(rollXP);
  { const f = state.boss.fight; if(f && f.won && t > f.end){ const b = bossInfo(f.n), pct = Math.floor(f.dmg/f.hp*100);
      if(f.dmg >= f.hp*OVERKILL_AT - 1e-9){ const bonus = Math.round(b.xp*OVERKILL_BONUS), d = day();
        d.extraXP = r1((d.extraXP||0) + bonus); gainXP(bonus);
        const rec = state.boss.defeated.find(x=>x.n===f.n); if(rec) rec.ok = true;
        fx('quest', 'OVERKILL', `${pct}%`);
        notify(`<b>${esc(b.name)}</b> was crushed with <b>${pct}%</b> damage.<br><br>Overkill bonus: <b>+${bonus} XP</b><br><span class="muted small">Marked on its trophy.</span>`, {title:'OVERKILL'});
      }
      state.boss.fight = null; } }
  { const f = state.boss.fight; if(f && !f.won && t > f.end){ const b = bossInfo(f.n);
      notify(`<b>${esc(b.name)}</b> escaped with ${fmtN(Math.max(0, Math.round(f.hp-f.dmg)))} HP left.<br><br>No penalty. It will be waiting again on Monday.<br><span class="muted small">Grow your Power and habits, then try again.</span>`, {title:'BOSS ESCAPED'});
      state.boss.fight = null; } }
  if(rested) notify(`<b>Deep Rest</b> covered your unfinished Daily Quest${rested>1?'s':''}.<br>No penalty, and your streak is safe.`, {title:'REST DAY'});
  if(dream){ gainXP(dream); notify(`<b>Transcendent.</b><br>Dream XP: <b>+${dream} XP</b><br>Yesterday's debuffs won't follow you today.`, {title:'SKILL'}); }
  if(clean){ gainXP(cleanXP); notify(`Clean day bonus: <b>+${cleanXP} XP</b><br>Clean streak: ${state.cleanRun} day${state.cleanRun===1?'':'s'}.`, {title:'BONUS'}); }
  if(failed){
    state.penalty = {xp:lost};
    notify(`You failed to complete the Daily Quest${failed>1?` on ${failed} days`:''}.<br><br><b>−${lost} XP</b><br>${saved?'<b>Second Life</b> kept your streak alive.':'Streak reset.'} A <b>Penalty Quest</b> has been issued.`, {red:true, title:'PENALTY'});
    gainXP(-lost);
  }
  if(decay){
    const noProtect = maxIdle > RANK_LOSS_AFTER;
    notify(`Inactivity detected.<br>Your power is fading: <b>−${decay} XP</b>${noProtect?'<br><br>You have been gone over 30 days. <b>Rank protection lost.</b>':''}`, {red:true, title:'DECAY'});
    gainXP(-decay, {noProtect});
  }
  checkTitles(); save();
}
const monthlyRespecReady = () => !state.lastMonthlyRespec || daysBetween(state.lastMonthlyRespec, dayKey())>=30;

function askRespec(){
  if(!respecAvail()){ toast('No respec available right now', true); return; }
  const tot = allocTotal();
  if(!tot){ toast('No placed points to reset'); return; }
  const after = Object.fromEntries(Object.keys(state.stats).map(k=>[k, state.stats[k]-(state.alloc[k]||0)]));
  const willLose = SKILLS.filter(k=>skill(k.id) && Object.entries(k.req).some(([st,v])=>after[st] < v));
  notify(`Reset all <b>${tot}</b> stat points you placed by hand?<br><br><span class="muted small">They return to your pool to spend again. Stat growth from activities stays.<br>Respecs available: ${respecAvail()}</span>${willLose.length?`<br><br><span class="bad"><b>Skills you will lose:</b><br>${willLose.map(k=>esc(k.name)).join(', ')}</span>`:'<br><br><span class="good small">No skills will be lost.</span>'}`,
    {title:'RESPEC', ok:'RESET POINTS', cancel:true, onOk:()=>{ doRespec(); return true; }});

function doRespec(){
  const tot = allocTotal();
  for(const k in state.alloc){ const nv = Math.max(1, r2(state.stats[k] - state.alloc[k])); trackStat(k, nv - state.stats[k]); state.stats[k] = nv; state.alloc[k] = 0; }
  state.points += tot;
  if(monthlyRespecReady()) state.lastMonthlyRespec = dayKey(); else state.respecTokens = Math.max(0, (state.respecTokens||0)-1);
  const lost = SKILLS.filter(k=>state['sk_'+k.id] && !skill(k.id));
  lost.forEach(k=>delete state['sk_'+k.id]);
  save();
  notify(`<b>${tot} points</b> returned to your pool.${lost.length?`<br><br><span class="bad"><b>Skills lost:</b><br>${lost.map(k=>esc(k.name)).join(', ')}</span><br><br><span class="small">Spend points to unlock them again, or build a new path.</span>`:''}`, {title:'RESPEC', red:lost.length>0});
}

/* Weapon = highest stat, panel effect = second-highest. A new stat only takes over when it leads by 2+ points (no flicker). */
const STAT_ORDER = ['STR','AGI','VIT','INT','SEN'];
function avatarBuild(){
  const st = state.stats, rank = k => STAT_ORDER.slice().sort((a,b)=>st[b]-st[a] || STAT_ORDER.indexOf(a)-STAT_ORDER.indexOf(b));
  const sorted = rank();
  let top = state.avTop && st[state.avTop]!=null ? state.avTop : sorted[0];
  if(st[sorted[0]] >= st[top] + 2) top = sorted[0];
  const rest = sorted.filter(k=>k!==top);
  let second = state.avSecond && state.avSecond!==top && st[state.avSecond]!=null ? state.avSecond : rest[0];
  if(st[rest[0]] >= st[second] + 2) second = rest[0];
  if(state.avTop!==top || state.avSecond!==second){ state.avTop = top; state.avSecond = second; save(); }
  return {top, second};
}
function condition(){
  const net = tempMods().reduce((a,m)=>a+m.pct,0);
  const idle = daysBetween(state.lastActive, dayKey()) >= 2;
  if(state.penalty) return {k:'penalty', label:'PENALIZED', color:'var(--bad)', net};
  if(idle)          return {k:'idle',    label:'DORMANT',   color:'var(--muted)', net};
  if(net<0)         return {k:'weak',    label:'WEAKENED',  color:'var(--bad)', net};
  if(net>=10)       return {k:'strong',  label:'EMPOWERED', color:'var(--good)', net};

}

const PERIODS = {'7':7, '30':30, '90':90, 'all':0};
function periodKeys(n, offset=0){
  const t = dayKey(); let end = addDays(t, -offset*(n||0)), start = n ? addDays(end, -(n-1)) : state.createdAt;
  if(start < state.createdAt) start = state.createdAt;
  const ks = []; for(let k=start; k<=end && ks.length<4000; k=addDays(k,1)) ks.push(k);
  return ks;
}
const dayBonus = d => (d.bonus||0) + (d.cleanXP||0) + (d.dream||0) + (d.extraXP||0);
const dayNet = d => d ? d.xp + dayBonus(d) - (d.pen||0) : 0;
const dayGain = d => d ? d.log.reduce((a,e)=>a+Math.max(0,e.xp),0) + dayBonus(d) : 0;
const SLEEP_HRS = {4:4.5, 5:5.5, 6:6.5, 7:8, 9:9.5};
function dashStats(ks){
  const D = ks.map(k=>state.days[k]), t = dayKey(), n = ks.length || 1;
  const o = {days:ks.length};
  o.net = D.reduce((a,d)=>a+dayNet(d),0); o.avgXP = o.net/n;
  o.gainAvg = D.reduce((a,d)=>a+dayGain(d),0)/n;
  let done=0, judged=0; ks.forEach((k,i)=>{ const d=D[i]; if(!d) { if(k<t) judged++; return; } if(d.status==='done'){done++; judged++;} else if(d.status==='failed' || (k<t && d.status!=='rest')) judged++; });
  o.clear = judged ? done/judged : null; o.cleared = done; o.judged = judged;
  o.active = D.filter(isActive).length;
  const sumCat = (cat, sign) => D.reduce((a,d)=>a+(d?d.log.filter(e=>A[e.id]&&[].concat(cat).includes(A[e.id].cat)).reduce((x,e)=>x+(sign>0?Math.max(0,e.xp):Math.min(0,e.xp)),0):0),0);
  o.src = {exercise:sumCat(EX_CATS,1), steps:sumCat('steps',1), mind:sumCat(MIND_CATS,1), sleep:sumCat('sleep',1), fast:sumCat('fast',1), bonus:D.reduce((a,d)=>a+(d?dayBonus(d):0),0)};
  o.loss = {food:Math.abs(sumCat('food',-1)), vice:Math.abs(sumCat('vice',-1)), sleep:Math.abs(sumCat('sleep',-1)), pen:D.reduce((a,d)=>a+(d&&d.pen||0),0), couch:D.reduce((a,d)=>a+(d?d.log.reduce((x,e)=>x+(e.cp||0),0):0),0)};
  const sl = D.map(d=>tierVal(d,'sleep')).filter(v=>v!=null).map(v=>SLEEP_HRS[v]||v);
  o.sleep = sl.length ? sl.reduce((a,b)=>a+b,0)/sl.length : null;
  const st = D.map(d=>tierVal(d,'steps')).filter(v=>v!=null);
  o.steps = st.length ? st.reduce((a,b)=>a+b,0)/st.length : null;
  const fs = D.map(d=>d&&d.log.find(e=>e.id==='fast')).filter(Boolean).map(e=>e.hours);
  o.fastAvg = fs.length ? fs.reduce((a,b)=>a+b,0)/fs.length : null; o.fastMax = fs.length ? Math.max(...fs) : null; o.fasts = fs.length;
  const act = D.filter(isActive);
  o.water = act.length ? act.reduce((a,d)=>a+units(d,'water'),0)/act.length : null;
  o.clean = act.filter(d=>!d.log.some(e=>isSlip(e,'vice'))).length;
  o.scroll = D.reduce((a,d)=>a+count(d,'scroll'),0);
  o.sg = {}; Object.keys(STATS).forEach(k=>{ o.sg[k] = r2(D.reduce((a,d)=>{ if(!d) return a; if(d.sg) return a+(d.sg[k]||0); return a + d.log.reduce((x,e)=>x+((e.st&&e.st[k])||0),0); },0)); });
  return o;
}

/* ---------- weight insights ---------- */
function weightCard(ks){
  const pts = ks.map(k=>({k, e:wtEntry(state.days[k])})).filter(p=>p.e);
  if(!on('weight') && !pts.length) return '';
  const hide = state.wtHide, g = state.wtGoal;
  let html = `<div class="panel"><span class="ptitle">WEIGHT</span>`;
  if(!pts.length) return html + '<div class="muted small center">No weigh-ins in this period yet.</div></div>';
  // chart: dots = weigh-ins, line = 7-day trend
  const avg = ks.map(k=>({k, v:wtAvg(k)})).filter(p=>p.v!=null && p.k>=pts[0].k);
  const vals = [...pts.map(p=>p.e.kg), ...avg.map(p=>p.v)], lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(.5, hi-lo);
  const W = 300, H = 110, x = k => ks.length<2 ? W/2 : daysBetween(ks[0],k)/(ks.length-1)*(W-16)+8, y = v => H-10-(v-lo)/span*(H-24);
  const line = avg.map((p,i)=>`${i?'L':'M'}${r1(x(p.k))} ${r1(y(p.v))}`).join(' ');
  const first = avg.length ? avg[0].v : pts[0].e.kg, last = avg.length ? avg[avg.length-1].v : pts[pts.length-1].e.kg, chg = last-first;
  const chgTxt = hide ? `${chg<0?'▼':chg>0?'▲':''} ${Math.abs(chg/first*100).toFixed(1)}%` : `${chg>0?'+':chg<0?'−':'±'}${Math.abs(toUnit(chg)).toFixed(1)} ${state.wtUnit}`;
  html += `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" aria-label="Weight trend">
      ${pts.map(p=>`<circle cx="${r1(x(p.k))}" cy="${r1(y(p.e.kg))}" r="2.6" fill="rgba(var(--g),.45)"/>`).join('')}
      <path d="${line}" fill="none" stroke="var(--glow)" stroke-width="2.2" stroke-linejoin="round"/></svg>
    <div class="tiny muted center">Dots: weigh-ins · Line: 7-day trend</div>
    <div class="kcards" style="margin-top:10px">
      <div class="kcard"><span>TREND NOW</span><b>${hide?'•••':fmtW(last)}</b><small>7-day average</small></div>
      <div class="kcard"><span>CHANGE</span><b>${chgTxt}</b><small>over this period</small></div>
      <div class="kcard"><span>WEIGH-INS</span><b>${pts.length}</b><small>of ${ks.length} days</small></div>
      <div class="kcard"><span>GOAL</span><b style="font-size:1.1rem">${g?({lose:'Lose',gain:'Gain',maintain:'Maintain'})[g.dir]:'—'}</b><small>${goalText(last)}</small></div>
    </div>
    ${wtTooFast(wtTrend())?'<div class="center small gold" style="margin-top:8px">Your trend is moving faster than ~1% of body weight per week. Faster than recommended — steady wins.</div>':''}`;
  html += wtPatterns();
  return html + '</div>';
}
function goalText(now){
  const g = state.wtGoal; if(!g) return 'set one in ⚙ Settings';
  if(!(g.target>0) || now==null) return 'no target weight';
  if(g.dir==='maintain'){ const off = now-g.target; return state.wtHide ? `${Math.abs(off/g.target*100).toFixed(1)}% from target` : `${Math.abs(toUnit(off)).toFixed(1)} ${state.wtUnit} from target`; }
  const start = g.start ?? now, total = g.target-start, done = now-start;
  const p = total ? clamp(done/total, 0, 1) : 1;
  return `${Math.round(p*100)}% of the way${state.wtHide?'':` to ${fmtW(g.target)}`}`;
}
/* compares weeks where the trend moved most in your goal's direction with the other weeks (needs 4+ weeks) */
function wtPatterns(){
  const t = dayKey(), lastSun = addDays(weekKey(t), -1);
  const weeks = [];
  for(let i=0;i<52;i++){ const end = addDays(lastSun, -7*i); if(end < state.createdAt) break;
    const a = wtAvg(end), b = wtAvg(addDays(end,-7)); if(a!=null && b!=null) weeks.push({end, chg:a-b}); }
  if(weeks.length < 4) return `<h3>WHAT MOVED WITH YOUR WEIGHT</h3><div class="small muted">Needs about 4 weeks of weigh-ins. ${weeks.length}/4 so far.</div>`;
  const dir = (state.wtGoal && state.wtGoal.dir) || 'lose';
  const score = w => dir==='gain' ? w.chg : dir==='maintain' ? -Math.abs(w.chg) : -w.chg;
  weeks.sort((p,q)=>score(q)-score(p));
  const half = Math.floor(weeks.length/2), best = weeks.slice(0,half), rest = weeks.slice(half);
  const days = w => Array.from({length:7}, (_,i)=>state.days[addDays(w.end,-i)]);
  const per = (ws, f) => { const v = ws.map(w=>f(days(w))).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const F = [
    ['Exercise XP / day', D=>D.reduce((a,d)=>a+(d?d.log.filter(e=>isEx(A[e.id])).reduce((x,e)=>x+Math.max(0,e.xp),0):0),0)/7, v=>Math.round(v)],
    ['Steps (avg)', D=>{ const v=D.map(d=>tierVal(d,'steps')).filter(v=>v!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }, v=>r1(v/1000)+'k'],
    ['Fasts 12h+ / week', D=>D.filter(d=>d&&d.log.some(e=>e.id==='fast')).length, v=>r1(v)],
    ['Sweets & fast food / week', D=>D.reduce((a,d)=>a+count(d,'sweets')+count(d,'sugary')+count(d,'junk')+count(d,'order'),0), v=>r1(v)],
    ['Alcohol / week', D=>D.reduce((a,d)=>a+count(d,'alcohol'),0), v=>r1(v)],
    ['Sleep (avg)', D=>{ const v=D.map(d=>tierVal(d,'sleep')).filter(v=>v!=null).map(v=>SLEEP_HRS[v]||v); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }, v=>r1(v)+'h'],
  ];
  const lab = dir==='gain' ? 'Weeks you gained most' : dir==='maintain' ? 'Steadiest weeks' : 'Weeks you lost most';
  return `<h3>WHAT MOVED WITH YOUR WEIGHT</h3>
    <div class="hrow"><span class="muted small">${weeks.length} weeks compared</span><b class="small"><span class="good">${lab}</span> · <span class="muted">other weeks</span></b></div>
    ${F.map(([n,f,fm])=>`<div class="hrow"><span>${n}</span><b><span class="good">${(x=>x==null?'—':fm(x))(per(best,f))}</span> · <span class="muted">${(x=>x==null?'—':fm(x))(per(rest,f))}</span></b></div>`).join('')}
    <div class="tiny muted" style="margin-top:6px">Patterns, not proof: many things move weight from week to week (water, salt, stress).</div>`;
}

  if(ds.timer) return toggleTimer(ds.timer);
  if(ds.timercancel){ state.timer = null; save(); render(); toast('Timer cancelled'); return; }
  if(ds.fday){ fastDay = ds.fday; document.querySelectorAll('[data-fday]').forEach(x=>x.classList.toggle('on', x.dataset.fday===fastDay)); return; }
  if(ds.period){ state.recPeriod = ds.period; save(); render(); return; }
  if(ds.cos!==undefined){ state.cosmetic = ds.cos==='' ? null : +ds.cos; save(); render(); return; }
  if(ds.add) return logCount(ds.add, parseFloat(ds.n));
  if(ds.num) return askNumber(ds.num);
  if(ds.tier) return setTier(ds.tier, +ds.i);
  if(ds.pen) return logPen(ds.pen);
  if(ds.once) return logOnce(ds.once);
  if(ds.undo!==undefined) return removeEntry(+ds.undo);
  if(ds.q) return questStep(ds.q, parseFloat(ds.d));
  if(ds.alloc){ if(state.points>0){ const k=ds.alloc; state.points--; state.stats[k]=r2(state.stats[k]+1); trackStat(k, 1); state.alloc[k]=(state.alloc[k]||0)+1; toast(`${k} +1${allocPreview(k)}`); checkUnlocks(); save(); render(); } return; }
  if(ds.title){ state.title=ds.title; save(); render(); return; }
  if(ds.delq){ b.closest('.qrow').remove(); return; }
  switch(b.id){
    case 'clearPen': return clearPenalty();
    case 'avFlip': return flipAvatar();
    case 'rateInfo': return showRateInfo();
    case 'wtHide': state.wtHide = !state.wtHide; save(); render(); return;
    case 'saveWtGoal': { const v = parseFloat(($('#wtTarget').value||'').replace(',','.')); state.wtGoal = state.wtGoal || {dir:'lose'};
      state.wtGoal.target = v>0 ? fromUnit(v) : null; state.wtGoal.start = wtAvg(dayKey()) ?? lastWeight(); save(); toast('Goal saved'); render(); return; }
    case 'respec': return askRespec();
    case 'reroll': return rerollQuest();
    case 'autoRest': state.autoRest = state.autoRest===false; save(); render(); toast(`Auto rest day ${state.autoRest?'on':'off'}`); return;
    case 'resetOrder': state.order = null; save(); render(); toast('Default order restored'); return;
    case 'rest': if(restAllowed()){ day().status='rest'; save(); render(); toast('Rest day declared. Recover well.'); } return;
    case 'unrest': day().status=null; checkQuest(); save(); render(); return;
    case 'fastStart': return askFastStart();
    case 'fastEarlier': nextModal(); setTimeout(()=>fastTimeModal(true), 30); return;
    case 'bossGo': return notify(`Start the fight against <b>${esc(bossInfo(state.boss.n).name)}</b>?<br><br>You get <b>${BOSS_DAYS} days</b> (ends ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][weekdayIdx(addDays(dayKey(),BOSS_DAYS-1))]} at midnight). Every XP you earn deals damage × your Power, including what you've already earned today.<br><br><span class="muted small">One attempt per week. Losing costs nothing.</span>`, {title:'CHALLENGE', ok:'FIGHT', cancel:true, onOk:()=>{ setTimeout(startBoss, 0); return true; }});
    case 'fastEnd': return endFast();
    case 'fastAdj': return fastTimeModal(false);
    case 'saveSetup': {
      document.querySelectorAll('[data-en]').forEach(c=>{ state.enabled[c.dataset.en]=c.checked; });
      if(!state.setupDone){ state.setupDone=true; tab='log'; notify('Your activities are set.<br>Log good choices to grow stronger. Bad ones will cost you.<br><br>Your <b>Daily Quest</b> resets every midnight.', {title:'SYSTEM', ok:'BEGIN'}); }
      else { tab='settings'; toast('Activities saved'); }
      checkQuest(); save(); render(); window.scrollTo(0,0); return;
    }
    case 'saveName': state.name=$('#nm').value.trim().slice(0,24); save(); toast('Name saved'); render(); return;
    case 'savePool': { const ids=[...document.querySelectorAll('[data-pool]')].filter(c=>c.checked).map(c=>c.dataset.pool);
      if(!ids.length){ toast('Pick at least one activity', true); return; }
      state.questPool = ids; const d=day(); if(d.quest && !ids.includes(d.quest.id) && dayValue(d,d.quest.id)===0 && d.status!=='done'){ d.quest=null; ensureQuest(); }
      save(); toast('Rotation saved'); render(); return; }
    case 'exp': { const txt=JSON.stringify(state); $('#bk').value=txt;
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Backup copied to clipboard'),()=>toast('Select the text below and copy it')); return; }
    case 'imp': try{ const o=JSON.parse($('#bk').value); if(!o.stats||!o.days) throw 0; state=normalize(o); save(); toast('Backup restored'); render(); }catch(e){ toast('That backup is not valid', true); } return;
    case 'reset': notify('This erases your player, stats and history permanently.<br><br>Type <b>RESET</b> to confirm.', {red:true, title:'WARNING', ok:'ERASE EVERYTHING', cancel:true,
      extra:'<input type="text" id="rs" placeholder="RESET" style="margin-bottom:12px">', onOk:()=>{ if(($('#rs').value||'').trim().toUpperCase()!=='RESET') return true;
        state=fresh(); save(); tab='status'; setTimeout(awaken,50); return true; }}); return;
  }
});
function flipAvatar(){
  const box = document.querySelector('.av5'); if(!box){ avMode = avMode==='front'?'back':'front'; render(); return; }
  box.classList.add('squash');
  setTimeout(()=>{ avMode = avMode==='front' ? 'back' : 'front'; render(); const b2 = document.querySelector('.av5'); if(b2){ b2.classList.add('squash'); requestAnimationFrame(()=>requestAnimationFrame(()=>b2.classList.remove('squash'))); } }, 160);
}
{ let ax = null;
  document.addEventListener('pointerdown', e=>{ ax = e.target.closest && e.target.closest('#avStage') ? e.clientX : null; });
  document.addEventListener('pointerup', e=>{ if(ax!==null && Math.abs(e.clientX-ax)>40) flipAvatar(); ax = null; });
  document.addEventListener('pointercancel', ()=>{ ax = null; }); }
function checkUnlocks(){
  SKILLS.forEach(k=>{ const key='sk_'+k.id; if(skill(k.id) && !state[key]){ state[key]=true;
    notify(`Skill unlocked: <b>${esc(k.name)}</b><br><span class="muted small">${esc(k.desc)}</span>`, {title:'SKILL'}); } });
}
function saveQuest(){
  const items = [...document.querySelectorAll('.qrow')].map(r=>{
    const get = f => r.querySelector(`[data-f="${f}"]`).value;
    const label = get('label').trim(); if(!label) return null;
    const target = Math.max(0.5, parseFloat(get('target'))||1), link = get('link');
    return {id:r.dataset.id, label:label.slice(0,30), target, unit:get('unit').trim().slice(0,12), ...(link?{link}:{step:target>=20?Math.round(target/5):1})};
  }).filter(Boolean);
  if(!items.length){ toast('Add at least one task', true); return; }
  state.quest = items; checkQuest(); save(); toast('Daily Quest updated'); render();
}

/* ---------- first run ---------- */
function awaken(){
  notify('Welcome to <b>Ascend</b>.<br>A new Player has been detected.<br>The System will track your choices — and your body will follow.<br><br>Enter your name to awaken.',
    {title:'SYSTEM', ok:'AWAKEN', extra:'<input type="text" id="aw" placeholder="Your name" maxlength="24" style="margin-bottom:12px">',
     onOk:()=>{ const v=($('#aw').value||'').trim(); if(!v) return false; state.name=v.slice(0,24); tab='setup'; save(); return true; }});
}

/* ---------- boot ---------- */
fillBossTitles();
load();
applyTheme();
rollover();
if(state.name && !state.setupDone) tab='setup';
render();
if(!state.name) awaken();
else if(!state.setupDone && state.v===2 && Object.keys(state.days).length) notify('The System has been upgraded.<br><br>New: activity choices, caps, fasting, avatar, ranks to SSS, stat perks and skills.<br><br>Choose the activities you want to track.', {title:'SYSTEM UPDATE', ok:'CONTINUE'});
SKILLS.forEach(k=>{ if(skill(k.id)) state['sk_'+k.id]=true; });
if(state.bossCatchup){ delete state.bossCatchup; const f = state.boss.fight;
  if(f && !f.won){ const dmg = openingStrike(); if(dmg>0){ checkBossWin(); notify(`XP you earned on the day you started the fight now counts.<br><br><b>Opening strike: −${fmtN(Math.round(dmg))} HP</b> to ${esc(bossInfo(f.n).name)}.`, {title:'WEEKLY BOSS'}); } }
  save(); render(); }
if(state.upgradedV3 && state.setupDone){ delete state.upgradedV3; save();
  notify('<b>Daily Quest upgraded.</b><br><br>Each day now focuses on one exercise, rotating through the ones you do. The target is your recent average +33%.<br><br>Reward: +50 XP · Miss: −30 XP.<br><br>Made a mistake? Tap <b>SET TOTAL</b> to change any count.', {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(state.upgradedV3){ delete state.upgradedV3; save(); }
if(state.upgradedV4 && state.setupDone){ delete state.upgradedV4; save();
  notify('<b>Daily Quests expanded.</b><br><br>Your daily focus now rotates through Exercise, Steps, Mind & Wellbeing and Fasting (only what you actually do). Targets never go above the soft cap.<br><br>New: <b>Playing with pets</b> and the <b>Good Company</b> buff.', {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(state.upgradedV4){ delete state.upgradedV4; save(); }
if(!state.seenBossV14 && state.setupDone){ state.seenBossV14 = true; save();
  notify(`<b>The bosses have been redrawn.</b><br><br>Every boss type now has new, detailed art in its chapter's colours.`, {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(!state.seenBossV14){ state.seenBossV14 = true; }
if(!state.seenAvatarV13 && state.setupDone){ state.seenAvatarV13 = true; save();
  notify(`<b>Your avatar has been redrawn.</b><br><br>Your <b>highest stat</b> picks your weapon (Sense gets a spirit fox) and your <b>second-highest</b> adds an effect around you. Every rank changes your armour, weapon, headpiece and effects.<br><br>Tap <b>See back</b> or swipe on your avatar to turn around.`, {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(!state.seenAvatarV13){ state.seenAvatarV13 = true; }
if(state.upgradedV8 && state.setupDone){ delete state.upgradedV8; delete state.upgradedV7; delete state.upgradedV6; save();
  notify(`<b>Ascend ${VERSION}</b><br><br><b>30+ new activities</b>: running, swimming, weightlifting, climbing, sauna, breathwork and more. Exercise is now split into <b>Strength & Mobility</b> and <b>Cardio & Sports</b>, and Mind & Wellbeing into <b>Mind</b> and <b>Wellbeing</b>. New ones start off: pick them in <b>⚙ Settings → Choose activities</b>.<br><br><b>Weight tracker</b> (optional) · <b>Daily Quest targets</b> now come from your rank · <b>buffs</b> stack with diminishing returns instead of a hard cap · bosses: <b>opening strike</b> and <b>Overkill</b> · fasting countdowns · Records is now <b>Insights</b> · settings live behind the <b>⚙</b>.`, {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(state.upgradedV8){ delete state.upgradedV8; save(); }
if(state.upgradedV7 && state.setupDone){ delete state.upgradedV7; delete state.upgradedV6; save();
  notify('<b>Records dashboard</b><br><br>The Records tab now opens with a dashboard: your averages, where your XP comes from, habits, stat growth and what to aim for next. Switch between 7, 30, 90 days or All.<br><br><b>Couch Potato</b> now checks all your movement (steps <i>and</i> exercise), not just steps. Details in the Codex.', {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(state.upgradedV7){ delete state.upgradedV7; save(); }
if(state.upgradedV6 && state.setupDone){ delete state.upgradedV6; save();
  notify('<b>Weekly Bosses have arrived.</b><br><br>Check the Quests tab: a new boss appears each Monday. Challenge it any day Mon–Fri for a 3-day fight where your XP deals damage.<br><br>Also new: <b>Dead hang</b> and <b>Water</b>, a <b>timer</b> for Plank and Dead hang, fasts that started earlier, and new rank names.', {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(state.upgradedV6){ delete state.upgradedV6; save(); }
if(state.upgradedV5 && state.setupDone){ delete state.upgradedV5; save();
  notify('<b>Skill tree unlocked.</b><br><br>Each stat now has a 5-skill path (starting at 15), plus 10 hybrids, 3 triples and the Ascended capstone.<br><br>New <b>CODEX</b> tab explains skills, buffs, debuffs, XP and ranks.<br><br>You have <b>1 free respec</b> to rethink your points.', {title:'SYSTEM UPDATE', ok:'GOT IT'}); }
else if(state.upgradedV5){ delete state.upgradedV5; save(); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ load(); rollover(); render(); } });
setInterval(()=>{ if(state.timer && $('#tmr')) $('#tmr').textContent = fmtMS(timerSecs()); }, 1000);
setInterval(()=>{
  if(state.lastCheck < dayKey()){ rollover(); render(); return; }
  if(state.fast && $('#sbFast') && !$('#fastClock')) $('#sbFast').textContent = 'FASTING '+fmtHM(fastHours());
  if(state.fast && $('#qFast')) $('#qFast').textContent = fmtHM(fastHours());
  if(state.fast && $('#qFastLeft')) $('#qFastLeft').innerHTML = fastQuestText(fastHours(), +$('#qFastLeft').dataset.target);
  if(state.fast && $('#fastClock')){ const h=fastHours();
    $('#fastClock').textContent = fmtHM(h);
    if($('#sbFast')) $('#sbFast').textContent = 'FASTING '+fmtHM(h);
    $('#fastNext').textContent = fastNextText(h); }
  if(state.fast){ const hr = Math.floor(fastHours()); if(hr!==lastFastHr){ const was = lastFastHr; lastFastHr = hr; if(was!==null && !$('#modal').classList.contains('show') && !document.activeElement?.matches('input,textarea')) render(); } }
}, 20000);
let lastFastHr = null;
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
